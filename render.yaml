services:
  - type: web
    name: weatherstation-pro
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: weatherDB
      - key: MONGODB_COLLECTION
        value: weatherRecords
